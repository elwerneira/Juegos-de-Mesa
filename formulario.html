<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Registro | TableTop ET</title>
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html" class="logo-link">
                <img src="img/logo-navbar.png" alt="Logo de TableTop ET" class="logo-image">
            </a>
        </div>

        <nav>
            <ul>
                <li><a href="index.html#inicio">Inicio</a></li>
                <li><a href="index.html#top">Top Ventas</a></li>
                <li class="dropdown">
                    <a href="index.html#categorias">Categorias</a>
                    <ul class="dropdown-menu">
                        <li><a href="estrategia.html">Estrategia</a></li>
                        <li><a href="familiares.html">Familiares</a></li>
                        <li><a href="fiesta.html">Fiesta</a></li>
                        <li><a href="infantiles.html">Infantiles</a></li>
                    </ul>
                </li>
                <li><a href="formulario.html">Registro</a></li>
            </ul>
        </nav>
    </header>

    <section class="formulario-seccion">
        <div class="formulario-card">
            <div class="section-heading section-heading-left">
                <span class="eyebrow">Registro</span>
                <h2>Formulario de registro</h2>
                <p>Completa tus datos para recibir novedades y recomendaciones de nuestros juegos de mesa.</p>
            </div>

            <form class="formulario-registro" id="formularioRegistro" novalidate>
                <div class="campo-formulario">
                    <label for="nombre" class="form-label">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre completo">
                    <div class="mensaje-error" id="errorNombre"></div>
                </div>

                <div class="campo-formulario">
                    <label for="usuario" class="form-label">Usuario</label>
                    <input type="text" id="usuario" name="usuario" placeholder="Ingresa tu usuario">
                    <div class="mensaje-error" id="errorUsuario"></div>
                </div>

                <div class="campo-formulario">
                    <label for="correo" class="form-label">Correo electronico</label>
                    <input type="email" id="correo" name="correo" placeholder="nombre@correo.com">
                    <div class="mensaje-error" id="errorCorreo"></div>
                </div>

                <div class="campo-formulario">
                    <label for="password" class="form-label">Contrasena</label>
                    <div class="campo-password">
                        <input type="password" id="password" name="password" placeholder="Entre 6 y 18 caracteres">
                        <button type="button" class="toggle-password" data-target="password" aria-label="Mostrar u ocultar contrasena">
                            <svg class="icono-ojo" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                                <path class="icono-ojo-linea" d="M4 4l16 16"></path>
                            </svg>
                        </button>
                    </div>
                    <div class="mensaje-error" id="errorPassword"></div>
                </div>

                <div class="campo-formulario">
                    <label for="confirmarPassword" class="form-label">Confirmar contrasena</label>
                    <div class="campo-password">
                        <input type="password" id="confirmarPassword" name="confirmarPassword" placeholder="Repite tu contrasena">
                        <button type="button" class="toggle-password" data-target="confirmarPassword" aria-label="Mostrar u ocultar contrasena confirmada">
                            <svg class="icono-ojo" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                                <path class="icono-ojo-linea" d="M4 4l16 16"></path>
                            </svg>
                        </button>
                    </div>
                    <div class="mensaje-error" id="errorConfirmarPassword"></div>
                </div>

                <div class="campo-formulario">
                    <label for="fechaNacimiento" class="form-label">Fecha de nacimiento</label>
                    <input type="date" id="fechaNacimiento" name="fechaNacimiento">
                    <div class="mensaje-error" id="errorFechaNacimiento"></div>
                </div>

                <div class="campo-formulario">
                    <label for="direccion" class="form-label">Direccion de despacho</label>
                    <input type="text" id="direccion" name="direccion" placeholder="Opcional">
                    <div class="mensaje-ayuda">Este campo es opcional.</div>
                </div>

                <div class="acciones-formulario">
                    <button type="submit" class="btn btn-primary">Registrar</button>
                    <button type="reset" class="btn btn-secondary">Limpiar</button>
                </div>
            </form>
        </div>
    </section>

    <script src="js/script.js"></script>
</body>
</html>
