<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TableTop ET</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-vh-100">
     <header class="site-header container-fluid">
        <div class="logo">
            <a href="index.html" class="logo-link">
                <img src="img/logo-navbar.png" alt="Logo de TableTop ET" class="logo-image img-fluid">
            </a>
        </div>

        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-navigation" aria-label="Abrir menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav id="site-navigation">
            <ul class="mb-0">
                <li><a href="index.html#inicio">Inicio</a></li>
                <li><a href="index.html#top">Top Ventas</a></li>
                <li class="dropdown">
                    <a href="index.html#categorias">Categorias</a>
                    <ul class="dropdown-menu">
                        <li><a href="estrategia.html">Estrategia</a></li>
                        <li><a href="familiares.html">Familiares</a></li>
                        <li><a href="fiesta.html">Fiesta</a></li>
                        <li><a href="infantiles.html">Infantiles</a></li>
                    </ul>
                </li>
                <li><a href="loguin.html">Iniciar sesion</a></li>
            </ul>
        </nav>
    </header>

    <section class="formulario-seccion container-xl">
        <div class="formulario-card shadow-lg">
            <div class="section-heading section-heading-left">
                <span class="eyebrow">Acceso</span>
                <h2>Iniciar sesion</h2>
                <p>Ingresa con tu usuario registrado para continuar en TableTop ET.</p>
            </div>

            <form class="formulario-registro row g-3" id="loginForm" novalidate>
                <div class="campo-formulario col-12">
                    <label for="loginUsuario" class="form-label">Usuario o correo</label>
                    <input type="text" id="loginUsuario" name="loginUsuario" placeholder="Ingresa tu usuario o correo">
                    <div class="mensaje-error" id="errorLoginUsuario"></div>
                </div>

                <div class="campo-formulario col-12">
                    <label for="loginPassword" class="form-label">Contrasena</label>
                    <div class="campo-password">
                        <input type="password" id="loginPassword" name="loginPassword" placeholder="Ingresa tu contrasena">
                        <button type="button" class="toggle-password" data-target="loginPassword" aria-label="Mostrar u ocultar contrasena">
                            <svg class="icono-ojo" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                                <path class="icono-ojo-linea" d="M4 4l16 16"></path>
                            </svg>
                        </button>
                    </div>
                    <div class="mensaje-error" id="errorLoginPassword"></div>
                </div>

                <div class="acciones-formulario d-flex flex-column flex-md-row gap-3">
                    <button type="submit" class="btn btn-primary">Ingresar</button>
                    <button type="button" class="btn btn-secondary">Recuperar Clave</button>
                    <a class="btn btn-registro" href="formulario.html">Registrarse</a>
                </div>
            </form>

            <div class="formulario-feedback" id="loginFeedback" aria-live="polite"></div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
